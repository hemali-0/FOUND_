{% extends "base.html" %}
{% block title %}Sign Up — FOUND_{% endblock %}
{% block content %}
  <div class="auth-card">
    <h2>Sign Up</h2>
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="submit-row" style="justify-content:center;">
        <button type="submit" class="btn btn-yellow" style="width:100%;">Create Account</button>
      </div>
    </form>
    <div class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
  </div>
{% endblock %}
